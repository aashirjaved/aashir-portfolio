name: Live check

on:
  workflow_dispatch:
    inputs:
      url:
        description: Site to check
        default: https://aashir.net
  push:
    branches: [live-check]
  deployment_status:

jobs:
  live:
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE: ${{ github.event.inputs.url || 'https://aashir.net' }}
    steps:
      - uses: actions/checkout@v4
      - name: DNS from three public resolvers
        run: |
          for r in 1.1.1.1 8.8.8.8 9.9.9.9; do
            for n in aashir.net www.aashir.net; do
              echo "== @$r $n: $(dig +short @$r "$n" A | tr '\n' ' ')"
            done
          done
          apex=$(dig +short @1.1.1.1 aashir.net A | head -1)
          case "$apex" in 216.198.79.*|76.76.21.*) echo "apex on Vercel: yes";; *) echo "apex on Vercel: NO ($apex)"; exit 1;; esac
          dig +short @1.1.1.1 www.aashir.net CNAME | grep -q vercel-dns && echo "www on Vercel: yes" || { echo "www on Vercel: NO"; exit 1; }
      - name: Old GitHub Pages site redirects
        run: |
          body=$(curl -sSL https://aashirjaved.github.io/)
          echo "$body" | grep -q 'url=https://www.aashir.net/' && echo "pages redirect: yes" || { echo "pages redirect: not yet"; echo "$body" | head -5; }
      - name: HTTP
        run: |
          for u in https://aashir.net https://www.aashir.net; do
            [ -z "$u" ] && continue
            echo "== $u"
            curl -sS -o /tmp/body.html -D - -L --max-redirs 5 "$u" | grep -iE "^(HTTP|server|location|x-vercel-id|x-github-request-id|age)" || true
            echo "title: $(grep -o '<title>[^<]*' /tmp/body.html | head -1)"
            grep -q "Compliance and risk infrastructure for crypto and private credit" /tmp/body.html && echo "NEW SITE: yes" || echo "NEW SITE: no"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Visitor dogfood
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i --no-audit --no-fund playwright@1.56.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          code=$(curl -s -o /dev/null -w "%{http_code}" https://www.aashir.net/_vercel/insights/script.js); echo "analytics script: $code"
          [ "$code" = "200" ] && export EXPECT_ANALYTICS=1
          NODE_PATH=/tmp/pw/node_modules node "$GITHUB_WORKSPACE/scripts/live-dogfood.cjs" "$SITE" /tmp/shots
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-shots
          path: /tmp/shots
          if-no-files-found: ignore
