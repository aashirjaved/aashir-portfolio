name: Live check

on:
  workflow_dispatch:
    inputs:
      url:
        description: Site to check
        default: https://aashir.net
  push:
    branches: [live-check]
  deployment_status:

jobs:
  live:
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE: ${{ github.event.inputs.url || 'https://aashir.net' }}
    steps:
      - uses: actions/checkout@v4
      - name: DNS from three public resolvers
        run: |
          for r in 1.1.1.1 8.8.8.8 9.9.9.9; do
            for n in aashir.net www.aashir.net; do
              echo "== @$r $n: $(dig +short @$r "$n" A | tr '\n' ' ')"
            done
          done
          apex=$(dig +short @1.1.1.1 aashir.net A | head -1)
          case "$apex" in 216.198.79.*|76.76.21.*) echo "apex on Vercel: yes";; *) echo "apex on Vercel: NO ($apex)"; exit 1;; esac
          dig +short @1.1.1.1 www.aashir.net CNAME | grep -q vercel-dns && echo "www on Vercel: yes" || { echo "www on Vercel: NO"; exit 1; }
      - name: Old GitHub Pages site redirects
        run: |
          body=$(curl -sSL https://aashirjaved.github.io/)
          echo "$body" | grep -q 'url=https://www.aashir.net/' && echo "pages redirect: yes" || { echo "pages redirect: not yet"; echo "$body" | head -5; }
      - name: HTTP
        run: |
          for u in https://aashir.net https://www.aashir.net; do
            [ -z "$u" ] && continue
            echo "== $u"
            curl -sS -o /tmp/body.html -D - -L --max-redirs 5 "$u" | grep -iE "^(HTTP|server|location|x-vercel-id|x-github-request-id|age)" || true
            echo "title: $(grep -o '<title>[^<]*' /tmp/body.html | head -1)"
            grep -q "I build AI agents" /tmp/body.html && echo "NEW SITE: yes" || { echo "NEW SITE: no"; exit 1; }
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Visitor dogfood
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i --no-audit --no-fund playwright@1.56.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          code=$(curl -s -o /dev/null -w "%{http_code}" https://www.aashir.net/_vercel/insights/script.js); echo "analytics script: $code"
          [ "$code" = "200" ] && export EXPECT_ANALYTICS=1
          NODE_PATH=/tmp/pw/node_modules node "$GITHUB_WORKSPACE/scripts/live-dogfood.cjs" "$SITE" /tmp/shots
      - name: Lighthouse on the live site
        run: |
          cd /tmp/pw && npm i --no-audit --no-fund lighthouse@12 >/dev/null
          CHROME=$(node -e "console.log(require('playwright').chromium.executablePath())")
          for i in 1 2 3; do
            CHROME_PATH="$CHROME" npx lighthouse https://www.aashir.net/ --quiet --throttling-method=devtools \
              --chrome-flags="--headless=new --no-sandbox" --output=json --output-path=/tmp/lh-$i.json \
              --only-categories=performance,accessibility,best-practices,seo >/dev/null 2>&1
          done
          node -e '
            const runs = [1,2,3].map(i => require(`/tmp/lh-${i}.json`));
            for (const d of runs) {
              const s = Object.fromEntries(Object.entries(d.categories).map(([k, v]) => [k, Math.round(v.score * 100)]));
              console.log(JSON.stringify(s), "LCP", d.audits["largest-contentful-paint"].displayValue, "CLS", d.audits["cumulative-layout-shift"].displayValue);
            }
            const d0 = runs[1];
            const el = d0.audits["largest-contentful-paint-element"]?.details?.items?.[0]?.items?.[0]?.node;
            console.log("LCP element", el?.snippet, el?.selector);
            const bd = d0.audits["lcp-breakdown-insight"]?.details?.items?.[0]?.items;
            console.log("LCP breakdown", JSON.stringify(bd?.map(i => [i.subpart, Math.round(i.duration)])));
            const shifts = d0.audits["layout-shifts"]?.details?.items ?? [];
            console.log("Layout shifts", JSON.stringify(shifts.map(i => [i.node?.snippet?.slice(0, 80), i.score])));
            const lcp = runs.map(d => d.audits["largest-contentful-paint"].numericValue).sort((a, b) => a - b)[1];
            const a11y = Math.min(...runs.map(d => d.categories.accessibility.score));
            console.log("median LCP ms", Math.round(lcp));
            if (lcp > 1600) { console.log("LCP over the 1.6 s budget"); process.exit(1); }
            if (a11y < 1) { console.log("accessibility below 100"); process.exit(1); }
          '
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-shots
          path: /tmp/shots
          if-no-files-found: ignore

  engines:
    needs: live
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, firefox]
    env:
      SITE: ${{ github.event.inputs.url || 'https://aashir.net' }}
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Visitor dogfood in ${{ matrix.browser }}
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i --no-audit --no-fund playwright@1.56.1 >/dev/null
          npx playwright install --with-deps ${{ matrix.browser }} >/dev/null
          NODE_PATH=/tmp/pw/node_modules node "$GITHUB_WORKSPACE/scripts/live-dogfood.cjs" "$SITE" /tmp/shots
